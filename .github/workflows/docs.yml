name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/django_dirt_ratings/**"
      - ".github/workflows/docs.yml"

# Least privilege; the deploy job needs pages + id-token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          locked: true
      # Regenerates the reference pages + OpenAPI schema, then builds with Zensical.
      - run: pixi run -e docs docs-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only publish from main; PRs just run the strict build above.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<div id="reference" class="reference-panel{% if not reference_url %} d-none{% endif %}"
    hx-swap-oob="true">
    {% if reference_url %}
    <div class="card shadow-sm">
        <div class="card-body p-2">
            <img src="{{ reference_url }}" class="reference-image"
                alt="The same slice of the {{ reference_space }} template, with each landmark band named">
            <p class="reference-caption text-muted text-center mb-0 mt-1">
                <i class="fas fa-map-signs me-1"></i>
                Anatomy should sit inside these bands &middot; {{ reference_space }}
            </p>
        </div>
    </div>
    {% endif %}
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <input type="hidden" id="image-data" value="data:image/{{img_type}};base64,{{image}}">
        <div class="text-center">
            <div class="canvas-wrapper">
                <canvas id="canvas" class="responsive-canvas" data-grid-cols="{{ grid_cols }}"></canvas>
            </div>
            <p class="text-muted mt-3">
                <i class="fas fa-hand-pointer me-2"></i>
                Tap a cell to mark it &middot; drag to paint a region &middot;
                <strong>u</strong> = unsure, <strong>f</strong> = fail,
                <strong>Enter</strong> = submit{% if tutorial_url %} &middot;
                <a href="{{ tutorial_url }}" target="_blank" rel="noopener">tutorial</a>{% endif %}
            </p>
        </div>
    </div>
</div>

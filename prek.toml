[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
    { id = "ruff-check", args = [
        "--fix",
    ], types_or = [
        "python",
        "pyproject",
    ] },
    { id = "ruff-format", types_or = [
        "python",
        "pyproject",
    ] },
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.1"
hooks = [{ id = "codespell" }]

[project]
name = "dirt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "connectorx>=0.4.2",
    "django>=6.0.0",
    "django-environ>=0.12.0,<0.13",
    "celery>=5.5.0",
    "django-typer>=3.7.0",
    "django-ninja>=1.2.0",
    "orjson>=3.11.1",
    "psycopg>=3.2.9,<4",
    "django-celery-results>=2.5.1,<3",
]

[project.scripts]
manage = "dirt.manage:main"

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "prek",
    "pywatchman>=3.0.0,<4",
    "celery-types>=0.23.0",
    "django-stubs>=5.2.2",
    "jupyter>=1.1.1",
]
manage = [
    "bids2table>=2.1.0,<3",
    "django-stubs>=5.2.2",
    "neurorm @ git+https://github.com/psadil/neurorm.git",
    "dipy>=1.11.0",
    "imageio>=2.37.0",
    "matplotlib>=3.10.3",
    "nibabel>=5.3.2",
    "nilearn>=0.12.0",
    "nitransforms>=25.0.0",
    "numpy>=2.3.1",
    "polars>=1.31.0",

]


[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.lock'
check-hidden = true
# ignore-regex = ''
# ignore-words-list = ''

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
dirt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
manage = { features = ["manage"] }

[tool.pixi.tasks]
memcached = { cmd = ["memcached", "-vd", "-s", "/tmp/memcached.sock"] }
serve-rabbitmq = { cmd = ["rabbitmq-server", "-detached"] }
start-rabbitmq-workers = { cmd = [
    "celery",
    "-A",
    "dirt",
    "worker",
    "--detach",
], depends-on = [
    "serve-rabbitmq",
] }
runserver = { cmd = [
    "granian",
    "dirt.asgi:application",
    "--interface",
    "asginl",
    "--host",
    "0.0.0.0",
    "--no-ws",
    "--workers",
    "2",
    "--runtime-mode",
    "st",
    "--loop",
    "uvloop",
], depends-on = [
    "start-rabbitmq-workers",
] }

[tool.pixi.dependencies]
rabbitmq-server = ">=4.1.1,<5"
pymemcache = ">=4.0.0,<5"
granian = ">=2.6.0,<3"
uvloop = ">=0.22.1,<0.23"

[tool.pixi.feature.dev.tasks]

[tool.pixi.feature.dev.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.feature.manage.dependencies]
postgresql = ">=18.2,<19"

[tool.pixi.feature.manage.tasks]
devsetup = "./tools/devsetup.sh"

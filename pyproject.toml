[project]
name = "dirt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.0",
    "django-typer",
    "django-environ>=0.12.0,<0.13",
    "django-ninja>=1.2.0",
    "orjson>=3.11.1",
]

[project.scripts]
manage = "dirt.manage:main"

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "prek",
    "playwright",
    "pytest-playwright",
    "pywatchman>=3.0.0,<4",
    "django-stubs>=5.2.2",
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
]
manage = [
    "bids2table>=2.1.0,<3",
    "django-stubs>=5.2.2",
    "neurorm @ git+https://github.com/psadil/neurorm.git",
    "dipy>=1.11.0",
    "imageio>=2.37.0",
    "matplotlib>=3.10.3",
    "nibabel>=5.3.2",
    "nilearn>=0.12.0",
    "nitransforms>=25.0.0",
    "numpy>=2.3.1",
    "polars>=1.31.0",
]
docs = [
    # Zensical: the Material for MkDocs team's successor static site generator.
    # Reads mkdocs.yml natively. The `docs` env also gets the base `dirt` app
    # (django + django-ninja) via the editable install, so `manage export_openapi`
    # can introspect the API without the heavy `manage` neuro stack.
    "zensical",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dirt.settings"
pythonpath = ["src"]

[tool.ruff]
# Django writes migrations in its own style; leave the generated files alone.
extend-exclude = ["**/migrations/**"]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.lock'
check-hidden = true
# ignore-regex = ''
# ignore-words-list = ''

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
dirt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
manage = { features = ["manage"] }
# Own solve group: keep zensical (alpha) out of the default/dev/manage solve.
docs = { features = ["docs"] }

[tool.pixi.tasks]
runserver = { cmd = [
    "granian",
    "dirt.asgi:application",
    "--interface",
    "asginl",
    "--host",
    "0.0.0.0",
    "--no-ws",
    "--workers",
    "2",
    "--runtime-mode",
    "st",
    "--loop",
    "uvloop",
] }

[tool.pixi.dependencies]
granian = ">=2.6.0,<3"
uvloop = ">=0.22.1,<0.23"

[tool.pixi.feature.dev.tasks]
test = { cmd = ["pytest", "-v"] }

[tool.pixi.feature.dev.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.feature.manage.tasks]
devsetup = "./tools/devsetup.sh"

[tool.pixi.feature.manage.dependencies]
# devsetup.sh (and the dataset-download tutorials) shell out to `aws s3 sync`.
awscli = "*"
# Build toolchain for bidslake (PyO3/maturin); satisfies its build at install
# time so Dockerfile.manage needs no apt Rust.
rust = "*"
maturin = ">=1.7,<2"

[tool.pixi.feature.manage.pypi-dependencies]
# bidslake is a sibling checkout under neuro/; editable so the ingest specs and
# the bidslake adapters (crates/*/data) iterate together. bidslake pins
# requires-python >=3.14, which lifts the whole manage env to Python 3.14.
# For CI/release, pin to a git rev or a published wheel instead of a local path.
bidslake = { path = "../bidslake/crates/bidslake-py", editable = true }

[tool.pixi.feature.docs.tasks]
# Regenerate the auto-built reference pages (ast-based; no Django needed) and the
# django-ninja OpenAPI schema, then build/serve with Zensical (reads mkdocs.yml).
docs-gen = { cmd = "python tools/gen_reference.py && manage export_openapi", env = { DJANGO_SECRET_KEY = "docs-build-not-a-secret" } }
docs-build = { cmd = "zensical build --strict", depends-on = ["docs-gen"] }
docs-serve = { cmd = "zensical serve", depends-on = ["docs-gen"] }

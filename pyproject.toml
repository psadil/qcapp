[project]
name = "dirt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.0",
    "django-typer",
    "django-environ>=0.12.0,<0.13",
    "django-ninja>=1.7.0",
    # ipware extra is load-bearing: without it AXES_IPWARE_* is ignored behind the proxy
    "django-axes[ipware]>=8.3.1",
    "httpx>=0.28.1",
    "orjson>=3.11.1",
]

[project.scripts]
manage = "dirt.manage:main"

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "prek",
    "ruff==0.16.4",
    "ty==0.0.73",
    "playwright",
    "pytest-playwright",
    "pywatchman>=3.0.0,<4",
    "django-stubs>=5.2.2",
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
]
manage = [
    "django-stubs>=5.2.2",
    # bidslake query layer, pinned to a rev (built from git via maturin/rust at
    # install time). This is the *reader* only; the indexer CLI is a separate crate
    # in the same repo, and the Dockerfile's manage stage reads the rev back out of
    # this line to build it — so this pin is the single source of truth for both.
    "bidslake @ git+https://github.com/psadil/bidslake.git@ab8be383536e4bd7d9bdc28892b43c28448e01f0#subdirectory=crates/bidslake-py",
    { include-group = "neuro" },
]
# Split from `manage` so the dev env (Python 3.13, where the ty prek hook runs)
# can include the pip-wheel neuro stack without bidslake, which needs 3.14 + cargo.
neuro = [
    "dipy>=1.11.0",
    "imageio>=2.37.0",
    # ROI generation (ingest/rois.py): template assets per output space, plus
    # scipy.ndimage morphology (previously only a transitive dependency).
    "templateflow>=24.2",
    "scipy>=1.11",
    # matplotlib 3.11 is the first release whose Agg backend can savefig AVIF
    # (via Pillow); QC figures are stored as AVIF (see ingest/render.py).
    "matplotlib>=3.11.0",
    "nibabel>=5.3.2",
    "nilearn>=0.12.0",
    "nitransforms>=25.0.0",
    # applies the ITK displacement-field h5 artifacts built by ingest/rois.py
    "SimpleITK>=2",
    "numpy>=2.3.1",
    "polars>=1.31.0",
]
docs = [
    # Zensical: the Material for MkDocs team's successor static site generator.
    # Reads mkdocs.yml natively. The `docs` env also gets the base `dirt` app
    # (django + django-ninja) via the editable install, so `manage export_openapi`
    # can introspect the API without the heavy `manage` neuro stack.
    "zensical",
    # Python API reference via Zensical's mkdocstrings integration. The python
    # handler uses griffe's *static* analysis (parses source, no import), so the
    # models document without a Django settings bootstrap.
    "mkdocstrings[python]",
]


[tool.ty.environment]
# Type-check against the pixi dev env (the ty prek hook runs there via
# `pixi run -e dev ty check`); dev includes the neuro group, so ingest code
# resolves numpy/nibabel/… — bidslake alone stays unresolvable (see lake.py).
python = ".pixi/envs/dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dirt.settings"
pythonpath = ["src"]

[tool.ruff]
# Django writes migrations in its own style; leave the generated files alone.
extend-exclude = ["**/migrations/**"]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.lock'
check-hidden = true
# ignore-regex = ''
# ignore-words-list = ''

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
dirt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
# dev also carries the neuro group so ty (and the ingest tests) resolve the
# science stack; bidslake stays manage-only (needs Python 3.14 + a cargo build).
dev = { features = ["dev", "neuro"], solve-group = "default" }
manage = { features = ["manage"] }
# Own solve group: keep zensical (alpha) out of the default/dev/manage solve.
docs = { features = ["docs"] }

[tool.pixi.tasks]
collectstatic = { cmd = ["manage", "collectstatic", "--no-input"] }
# granian serves the collected assets itself (same shape as the container).
runserver = { cmd = [
    "granian",
    "dirt.asgi:application",
    "--interface",
    "asginl",
    "--host",
    "0.0.0.0",
    "--no-ws",
    "--workers",
    "2",
    "--runtime-mode",
    "st",
    "--loop",
    "uvloop",
    "--static-path-route",
    "/static",
    "--static-path-mount",
    "static",
], depends-on = ["collectstatic"] }

[tool.pixi.dependencies]
granian = ">=2.6.0,<3"
uvloop = ">=0.22.1,<0.23"

[tool.pixi.feature.dev.tasks]
test = { cmd = ["pytest", "-v"] }
# Committed figures, regenerated from the bundled sample data and TemplateFlow
# by the real renderer. Re-run (and commit the output) whenever the landmark
# ROIs, the palette, or the spatial-normalization rendering style changes.
reference-images = { cmd = ["python", "tools/make_reference_images.py"] }
tutorial-images = { cmd = ["python", "tools/make_tutorial_images.py"] }

[tool.pixi.feature.dev.dependencies]
jupyter = ">=1.1.1,<2"

[tool.pixi.feature.manage.tasks]
devsetup = "./tools/devsetup.sh"
# The bidslake indexer CLI, via a wrapper that refuses to run unless the sibling
# checkout at ../bidslake sits at the rev pinned above (BIDSLAKE_UNPINNED=1
# bypasses, for iterating on bidslake itself). The Docker image ships the CLI
# built from the pinned rev instead (see Dockerfile). Usage:
# pixi run -e manage bidslake index -i <dataset> -o study.duckdb
bidslake = "./tools/bidslake.sh"

[tool.pixi.feature.manage.dependencies]
# devsetup.sh (and the dataset-download tutorials) shell out to `aws s3 sync`.
awscli = "*"
# Build toolchain for bidslake (PyO3/maturin): builds the pinned git dependency
# at install time, so Dockerfile.manage needs no apt Rust.
rust = "*"
maturin = ">=1.7,<2"

# linux only: conda's C/C++ toolchain, so duckdb's bundled C++ and conda's rust linker share one sysroot.
[tool.pixi.feature.manage.target.linux-64.dependencies]
gcc_linux-64 = "*"
gxx_linux-64 = "*"

[tool.pixi.feature.docs.tasks]
# Regenerate the auto-built reference pages (ast-based; no Django needed) and the
# django-ninja OpenAPI schema, then build/serve with Zensical (reads mkdocs.yml).
docs-gen = { cmd = "manage export_openapi && manage export_plan_schema", env = { DJANGO_SECRET_KEY = "docs-build-not-a-secret" } }
docs-build = { cmd = "zensical build --strict", depends-on = ["docs-gen"] }
docs-serve = { cmd = "zensical serve", depends-on = ["docs-gen"] }
